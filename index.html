<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王佩琪 · 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f9f5f0 0%, #f0eae3 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #2c2825;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            padding: 64px 72px;
            box-shadow: 
                0 30px 60px -20px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset,
                0 0 0 1px rgba(200, 180, 160, 0.2);
            text-align: center;
            max-width: 760px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeUp 0.9s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(16px);
        }

        .card:hover {
            box-shadow: 
                0 40px 80px -24px rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.9) inset,
                0 0 0 1px rgba(180, 145, 99, 0.3);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(24px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dot-accent {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #c7a57b;
            border-radius: 50%;
            margin: 0 6px 4px 6px;
            opacity: 0.7;
        }

        .name {
            font-size: clamp(4rem, 16vw, 7rem);
            font-weight: 650;
            letter-spacing: 0.06em;
            line-height: 1.1;
            color: #1e1b18;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.08em;
            position: relative;
        }

        .char {
            display: inline-block;
            transition: transform 0.25s ease, color 0.25s ease;
            position: relative;
        }

        .char:hover {
            transform: translateY(-8px);
            color: #9b7b5a;
        }

        .name-underline {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c7a57b, #c7a57b, transparent);
            margin: 16px auto 28px auto;
            border-radius: 4px;
            opacity: 0.6;
        }

        .subhead {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #6b5f55;
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .subhead span {
            background: #e7dfd6;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #3d352e;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
        }

        .intro {
            font-size: 1.12rem;
            color: #4f4841;
            max-width: 480px;
            margin: 0 auto 48px auto;
            line-height: 1.7;
            font-weight: 380;
            border-top: 1px solid rgba(200, 180, 160, 0.3);
            padding-top: 32px;
        }

        .dot-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .dot-row span {
            width: 6px;
            height: 6px;
            background: #d6c8b9;
            border-radius: 50%;
            display: inline-block;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #1f1d1a;
            color: #f9f5f0;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 480;
            font-size: 1.02rem;
            letter-spacing: 0.3px;
            transition: background 0.25s, transform 0.15s, box-shadow 0.2s;
            border: 1px solid #1f1d1a;
            box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.2);
        }

        .contact-link:hover {
            background: #3a342e;
            border-color: #3a342e;
            transform: scale(1.02);
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.25);
        }

        .contact-link .arrow {
            font-size: 1.2rem;
            transition: transform 0.2s;
            display: inline-block;
        }

        .contact-link:hover .arrow {
            transform: translateX(4px);
        }

        .footer-note {
            margin-top: 44px;
            font-size: 0.78rem;
            color: #9b9289;
            letter-spacing: 0.5px;
            font-weight: 380;
        }

        @media (max-width: 600px) {
            .card {
                padding: 44px 24px;
                border-radius: 40px;
            }
            .name {
                font-size: 4.2rem;
                gap: 0.04em;
            }
            .subhead {
                font-size: 1rem;
                letter-spacing: 0.12em;
                gap: 8px;
            }
            .intro {
                font-size: 1rem;
                padding-top: 24px;
                margin-bottom: 32px;
            }
            .contact-link {
                padding: 12px 28px;
                font-size: 0.95rem;
            }
            .footer-note {
                margin-top: 32px;
                font-size: 0.7rem;
            }
            .name-underline {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 380px) {
            .name {
                font-size: 3.2rem;
            }
            .card {
                padding: 32px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="dot-row">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h1 class="name" aria-label="王佩琪">
            <span class="char">王</span>
            <span class="char">佩</span>
            <span class="char">琪</span>
        </h1>

        <div class="name-underline"></div>

        <div class="subhead">
            <span>设计师</span>
            <span class="dot-accent" style="width:4px;height:4px;margin:0;"></span>
            <span>创作者</span>
        </div>

        <p class="intro">
            用设计表达态度，用代码构建想法。<br>
            这里是我的个人空间，欢迎停留。
        </p>

        <a href="mailto:wangpeiqi@example.com" class="contact-link">
            ✉️ 联系我
            <span class="arrow">→</span>
        </a>

        <div class="footer-note">
            © 2025 王佩琪 · 保持好奇
        </div>
    </div>
</body>
  </html>
