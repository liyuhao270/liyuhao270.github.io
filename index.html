<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初二五班听好了</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFFF; /* 纯白背景 */
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            position: relative;
        }

        /* RGB流光变色动画定义 */
        @keyframes rgbFlow {
            0% { color: #ff0000; text-shadow: 0 0 5px rgba(255,0,0,0.3); }
            25% { color: #ff00ff; text-shadow: 0 0 5px rgba(255,0,255,0.3); }
            50% { color: #0000ff; text-shadow: 0 0 5px rgba(0,0,255,0.3); }
            75% { color: #00ffff; text-shadow: 0 0 5px rgba(0,255,255,0.3); }
            100% { color: #ff0000; text-shadow: 0 0 5px rgba(255,0,0,0.3); }
        }

        /* 标题 */
        .header {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 2px;
            animation: rgbFlow 3s infinite linear; /* 应用RGB变色 */
        }

        /* 大字排版区 */
        .main-text {
            margin-top: 120px;
            font-size: 56px;
            font-weight: bold;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .text-left {
            align-self: flex-start;
            animation: rgbFlow 3s infinite linear;
            animation-delay: 0.5s; /* 错开变色时间，更好看 */
        }

        .text-right {
            align-self: flex-end;
            margin-right: 15%;
            margin-top: 20px;
            animation: rgbFlow 3s infinite linear;
            animation-delay: 1s;
        }

        /* 小蓝字 */
        .sub-text {
            margin-top: 60px;
            margin-left: 40px;
            font-size: 16px;
            color: #6699cc; /* 截图里的浅蓝色 */
            line-height: 1.5;
            max-width: 200px;
        }

        /* 底部横线和问号 */
        .footer {
            margin-top: 60px;
            display: flex;
            align-items: center;
            margin-left: 40px;
            font-size: 40px;
            font-weight: bold;
        }

        .line {
            width: 150px;
            height: 3px;
            background-color: #333;
            margin-right: 20px;
        }

        .question-marks {
            color: #8fbc8f; /* 截图里的豆绿色 */
            letter-spacing: 10px;
        }

        /* 手机端适配 */
        @media (max-width: 480px) {
            .header { font-size: 24px; }
            .main-text { font-size: 46px; margin-top: 100px; }
            .sub-text { margin-left: 20px; font-size: 14px; }
            .footer { margin-left: 20px; font-size: 32px; }
            .line { width: 100px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部标题 -->
        <div class="header">初二五班听好了</div>

        <!-- 中间大字 -->
        <div class="main-text">
            <div class="text-left">看的</div>
            <div class="text-right">是给</div>
        </div>

        <!-- 浅蓝色小字 -->
        <div class="sub-text">
            看完把网址发给下一个人
        </div>

        <!-- 底部横线和问号 -->
        <div class="footer">
            <div class="line"></div>
            <div class="question-marks">? ? ?</div>
        </div>
    </div>

</body>
  </html>
