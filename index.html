<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初二五班 · 终极名单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0c;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .glow {
            position: absolute;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.4;
        }
        .glow-cyan { background: #00f3ff; top: -10%; left: -10%; }
        .glow-pink { background: #ff00ea; bottom: -10%; right: -10%; }

        .container {
            background: rgba(18, 18, 24, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 720px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
            position: relative;
            animation: fadeUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .header { text-align: center; margin-bottom: 40px; position: relative; }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            background: linear-gradient(90deg, #00f3ff, #ff00ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .header::after {
            content: '';
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #00f3ff, #ff00ea);
            margin: 16px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 10px #ff00ea;
        }

        .roster { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 40px; }

        .name-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0e0e0;
            transition: all 0.3s ease;
            cursor: default;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .name-tag:hover {
            background: rgba(0, 243, 255, 0.15);
            border-color: #00f3ff;
            color: #fff;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        /* 特殊名字（带括号的） */
        .name-tag.special { border-color: #ff00ea; color: #ff00ea; }
        .name-tag.special:hover {
            background: rgba(255, 0, 234, 0.15);
            border-color: #ff00ea;
            box-shadow: 0 0 20px rgba(255, 0, 234, 0.4);
            color: #fff;
        }

        /* 战神专属特效 */
        .name-tag.god-of-war {
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.2), rgba(255, 215, 0, 0.2));
            border: 1px solid #ff4500;
            color: #ffd700;
            font-weight: 800;
            text-shadow: 0 0 10px #ff4500;
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.5), inset 0 0 10px rgba(255, 69, 0, 0.2);
            animation: war-pulse 1.5s infinite alternate, war-shake 0.2s infinite;
        }

        .name-tag.god-of-war:hover {
            background: linear-gradient(135deg, #ff4500, #ffd700);
            color: #000;
            border-color: #fff;
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 0 30px #ff4500, 0 0 50px #ffd700;
            text-shadow: none;
            animation: none;
        }

        @keyframes war-pulse {
            0% { box-shadow: 0 0 10px rgba(255, 69, 0, 0.4); }
            100% { box-shadow: 0 0 25px rgba(255, 69, 0, 0.8), 0 0 10px #ffd700; }
        }

        @keyframes war-shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(0.5deg); }
            50% { transform: translate(-1px, -1px) rotate(-0.5deg); }
            75% { transform: translate(1px, -1px) rotate(0.5deg); }
            100% { transform: translate(-1px, 1px) rotate(-0.5deg); }
        }

        .mystery-text {
            text-align: center;
            font-size: 1.1rem;
            color: #888;
            letter-spacing: 0.2em;
            margin: 40px 0;
            padding: 20px;
            background: repeating-linear-gradient(-45deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 10px, transparent 10px, transparent 20px);
            border-radius: 12px;
            font-family: monospace;
            word-break: break-all;
        }

        .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent); margin: 20px 0 30px; }

        .footer {
            text-align: right;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.1em;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .footer .dash { color: #00f3ff; font-size: 2rem; line-height: 1; }

        .footer .name {
            background: linear-gradient(90deg, #fff, #00f3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        @media (max-width: 600px) {
            .container { padding: 32px 20px; }
            .header h1 { font-size: 1.6rem; }
            .name-tag { padding: 8px 16px; font-size: 0.95rem; }
            .mystery-text { font-size: 0.9rem; letter-spacing: 0.1em; }
            .footer { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="glow glow-cyan"></div>
    <div class="glow glow-pink"></div>

    <div class="container">
        <div class="header">
            <h1>初二五班 · 终极名单</h1>
        </div>

        <div class="roster">
            <span class="name-tag">丁丁</span>
            <span class="name-tag">老丈人</span>
            <span class="name-tag">达昌</span>
            <span class="name-tag">一鸣</span>
            <!-- 战神专属特效在这儿！ -->
            <span class="name-tag god-of-war">⚔️ 战神</span>
            <span class="name-tag">枫枫</span>
            <span class="name-tag">8根头</span>
            <span class="name-tag">猪腚</span>
            <span class="name-tag">明宣</span>
            <span class="name-tag">子墨</span>
            <span class="name-tag">星辰</span>
            <span class="name-tag special">（？？and旭）</span>
            <span class="name-tag">顺顺</span>
            <span class="name-tag">金源</span>
            <span class="name-tag">老二</span>
            <span class="name-tag">萝北头</span>
            <span class="name-tag">家园</span>
        </div>

        <div class="mystery-text">
            ………看…的…是…给………………………
        </div>

        <div class="divider"></div>

        <div class="footer">
            <span class="dash">—</span>
            <span class="name">你雨浩哥</span>
        </div>
    </div>
</body>
</html>
